server:
  port: 8082
spring:
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.activiti.spring.boot.SecurityAutoConfiguration
      - org.activiti.spring.boot.DataSourceProcessEngineAutoConfiguration
#  config:
#    import:
#      - classpath:application-workflow.yml # 如果你在 workflow 模块定义了单独的 yml
  activiti:
    # 自动检查并更新数据库表结构（第一次运行会自动创建25张表）
    database-schema-update: true
    # 历史记录级别
    history-level: audit
    # 自动部署流程定义文件的目录
    process-definition-location-prefix: classpath:/processes/

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 打印 SQL 日志，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true  # 开启驼峰命名自动转换
  global-config:
    db-config:
      # 逻辑删除配置
      logic-delete-field: deleted  # 全局逻辑删除的实体字段名
      logic-delete-value: 1        # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0    # 逻辑未删除值(默认为 0)
      id-type: auto               # 主键ID自增

# 开启详细日志打印
logging:
  level:
    root: INFO
    # 打印 Spring 事务管理日志
    org.springframework.jdbc.datasource: DEBUG
    # 打印 Activiti 引擎执行过程
    org.activiti: DEBUG
    # 打印 MyBatis 执行的 SQL 语句
    com.chenbitao: DEBUG
    org.mybatis: DEBUG
