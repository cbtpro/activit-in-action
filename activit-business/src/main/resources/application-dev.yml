server:
  port: 8083
spring:
  devtools:
    restart:
      enabled: true
  datasource:
    # 1. 业务数据库 (默认数据源)
    biz:
      jdbc-url: jdbc:mysql://localhost:3306/activiti_business?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      username: activiti_business
      password: activiti_business
      driver-class-name: com.mysql.cj.jdbc.Driver
  activiti:
    datasource:
      # 2. 流程数据库
      workflow:
        jdbc-url: jdbc:mysql://localhost:3306/activiti_workflow?characterEncoding=utf8&useSSL=false
        username: activiti_workflow
        password: activiti_workflow
        driver-class-name: com.mysql.cj.jdbc.Driver
    # 自动检查并更新数据库表结构（第一次运行会自动创建25张表）
    database-schema-update: true
    # 历史记录级别
    history-level: audit
    # 自动部署流程定义文件的目录
    process-definition-location-prefix: classpath:/processes/